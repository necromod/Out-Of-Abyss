{% extends "base.html" %}

{% block title %}NPCs - Out of the Abyss{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/fichas.css') }}">
{% endblock %}

{% block content %}
<div class="lista-container">
    <header class="lista-header">
        <h1>🎭 NPCs do Underdark</h1>
        <div class="lista-acoes">
            <button class="btn-principal" onclick="window.location.href='{{ url_for('fichas.novo_npc') }}'">
                ➕ Novo NPC
            </button>
        </div>
    </header>

    <div class="filtros">
        <input type="text" id="filtro-nome" placeholder="🔍 Buscar por nome..." oninput="filtrarLista()">
        <select id="filtro-status" onchange="filtrarLista()">
            <option value="">Todos</option>
            <option value="amigavel">Amigáveis</option>
            <option value="neutro">Neutros</option>
            <option value="hostil">Hostis</option>
        </select>
        <select id="filtro-local" onchange="filtrarLista()">
            <option value="">Todas as Localizações</option>
            <option value="velkynvelve">Velkynvelve</option>
            <option value="gracklstugh">Gracklstugh</option>
            <option value="neverlight">Neverlight Grove</option>
            <option value="blingdenstone">Blingdenstone</option>
            <option value="menzoberranzan">Menzoberranzan</option>
        </select>
        <label class="checkbox-label">
            <input type="checkbox" id="filtro-vivo" onchange="filtrarLista()">
            Apenas vivos
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="filtro-conhecido" onchange="filtrarLista()">
            Apenas conhecidos
        </label>
    </div>

    <div class="lista-grid lista-npcs" id="lista-npcs">
        <div class="loading">Carregando NPCs...</div>
    </div>
</div>

<!-- Template Card NPC (Estilo Compacto) -->
<template id="template-card-npc">
    <div class="card-npc-compacto" data-id="" data-status="" data-local="" data-vivo="" data-conhecido="">
        <!-- HEADER: Nome + Status -->
        <div class="card-npc-header"  onclick="verNPC(this)" >
            <h3 class="card-nome"  onclick="verNPC(this)" ></h3>
            <span class="card-status-badge"  onclick="verNPC(this)" ></span>
        </div>
        
        <!-- INFO BÁSICA: Raça + Classe/Ocupação -->
        <p class="card-tipo-info"></p>
        <p class="card-local-info">📍 <span class="local-valor"></span></p>
        
        <!-- DESCRIÇÃO -->
        <div class="card-descricao-box">
            <p class="card-descricao-texto"></p>
        </div>
        
        <!-- RELACIONAMENTO (se houver) -->
        <div class="card-relacionamento">
            <div class="relacionamento-container"></div>
        </div>
        
        <!-- TAGS -->
        <div class="card-tags-inline">
            <span class="tag tag-vivo"></span>
            <span class="tag tag-conhecido"></span>
        </div>
        
        <!-- BOTÕES -->
        <div class="card-botoes">
            <button class="btn-card-compacto btn-ver" onclick="verNPC(this)" title="Ver ficha completa">👁️</button>
            <button class="btn-card-compacto btn-notas" onclick="verNotas(this)" title="Notas do mestre">📝</button>
            <button class="btn-card-compacto btn-widget" onclick="abrirComoWidgetNPC(this)" title="Abrir como widget">📌</button>
        </div>
    </div>
</template>

<!-- Modal Notas -->
<div id="modal-notas" class="modal">
    <div class="modal-content modal-notas">
        <h3>📝 Notas do Mestre</h3>
        <input type="hidden" id="notas-npc-id">
        <textarea id="notas-texto" placeholder="Notas secretas sobre o NPC..."></textarea>
        <div class="modal-buttons">
            <button onclick="salvarNotas()">Salvar</button>
            <button onclick="fecharModal('modal-notas')">Fechar</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', carregarNPCs);

async function carregarNPCs() {
    const container = document.getElementById('lista-npcs');
    
    try {
        const response = await fetch('/fichas/api/npcs');
        const npcs = await response.json();
        
        lista_npcs = npcs;
        
        container.innerHTML = '';
        
        if (npcs.length === 0) {
            container.innerHTML = `
                <div class="lista-vazia">
                    <p>Nenhum NPC encontrado.</p>
                    <button class="btn-principal" onclick="window.location.href='{{ url_for('fichas.novo_npc') }}'">
                        Adicionar Primeiro NPC
                    </button>
                </div>
            `;
            return;
        }
        
        const template = document.getElementById('template-card-npc');
        
        npcs.forEach(npc => {
            const card = template.content.cloneNode(true);
            const cardEl = card.querySelector('.card-npc-compacto');
            
            cardEl.dataset.id = npc.id;
            cardEl.dataset.status = npc.alinhamento || 'neutro';
            cardEl.dataset.local = (npc.localizacao || '').toLowerCase();
            cardEl.dataset.vivo = npc.vivo ? '1' : '0';
            cardEl.dataset.conhecido = npc.conhecido ? '1' : '0';
            
            cardEl.querySelector('.card-nome').textContent = npc.nome;
            cardEl.querySelector('.card-tipo-info').textContent = `${npc.raca || 'Humanoide'} ${npc.classe || npc.ocupacao || ''}`;
            cardEl.querySelector('.local-valor').textContent = npc.localizacao || 'Desconhecido';
            cardEl.querySelector('.card-descricao-texto').textContent = (npc.descricao || 'Nenhuma descrição disponível.').substring(0, 120) + ((npc.descricao || '').length > 120 ? '...' : '');
            
            // Badge de status no header
            const statusBadge = cardEl.querySelector('.card-status-badge');
            if (npc.alinhamento === 'amigavel' || npc.aliado) {
                statusBadge.textContent = '💚';
                statusBadge.title = 'Aliado';
                cardEl.classList.add('status-aliado');
            } else if (npc.alinhamento === 'hostil' || npc.hostil) {
                statusBadge.textContent = '❤️';
                statusBadge.title = 'Hostil';
                cardEl.classList.add('status-hostil');
            } else {
                statusBadge.textContent = '💛';
                statusBadge.title = 'Neutro';
                cardEl.classList.add('status-neutro');
            }
            
            // Relacionamento (se houver)
            const relContainer = cardEl.querySelector('.relacionamento-container');
            if (npc.relacionamento_jogadores) {
                relContainer.innerHTML = `<div class="rel-mini">👥 ${npc.relacionamento_jogadores}</div>`;
            }
            
            // Tags inline
            const tagVivo = cardEl.querySelector('.tag-vivo');
            const tagConhecido = cardEl.querySelector('.tag-conhecido');
            
            if (!npc.vivo) {
                tagVivo.textContent = '💀 Morto';
                tagVivo.classList.add('tag-morto');
                cardEl.classList.add('npc-morto');
            } else {
                tagVivo.style.display = 'none';
            }
            
            if (!npc.conhecido) {
                tagConhecido.textContent = '❓ Desconhecido';
                tagConhecido.classList.add('tag-desconhecido');
            } else {
                tagConhecido.style.display = 'none';
            }
            
            container.appendChild(card);
        });
        
        // Aplica filtros atuais
        filtrarLista();
        
    } catch (error) {
        console.error('Erro ao carregar NPCs:', error);
        container.innerHTML = '<div class="erro">Erro ao carregar NPCs</div>';
        mostrarNotificacao('Erro ao carregar NPCs', 'danger');
    }
}

function filtrarLista() {
    const filtroNome = document.getElementById('filtro-nome').value.toLowerCase();
    const filtroStatus = document.getElementById('filtro-status').value;
    const filtroLocal = document.getElementById('filtro-local').value.toLowerCase();
    const apenasVivo = document.getElementById('filtro-vivo').checked;
    const apenasConhecido = document.getElementById('filtro-conhecido').checked;
    
    document.querySelectorAll('.card-npc-compacto').forEach(card => {
        const nome = card.querySelector('.card-nome').textContent.toLowerCase();
        const status = card.dataset.status;
        const local = card.dataset.local;
        const vivo = card.dataset.vivo === '1';
        const conhecido = card.dataset.conhecido === '1';
        
        const matchNome = nome.includes(filtroNome);
        const matchStatus = !filtroStatus || status === filtroStatus;
        const matchLocal = !filtroLocal || local.includes(filtroLocal);
        const matchVivo = !apenasVivo || vivo;
        const matchConhecido = !apenasConhecido || conhecido;
        
        card.style.display = (matchNome && matchStatus && matchLocal && matchVivo && matchConhecido) ? '' : 'none';
    });
}

function verNPC(btn) {
    const id = btn.closest('.card-npc-compacto').dataset.id;
    window.location.href = `/fichas/npc/${id}`;
}

function abrirComoWidgetNPC(btn) {
    const id = btn.closest('.card-npc-compacto').dataset.id;
    window.location.href = `/sessao/?widget=npc&id=${id}`;
}

async function verNotas(btn) {
    const card = btn.closest('.card-npc-compacto');
    const id = card.dataset.id;
    
    try {
        const response = await fetch(`/api/npcs/${id}`);
        const npc = await response.json();
        
        document.getElementById('notas-npc-id').value = id;
        document.getElementById('notas-texto').value = npc.notas || '';
        document.getElementById('modal-notas').classList.add('ativo');
        
    } catch (error) {
        console.error('Erro ao carregar notas:', error);
    }
}

async function salvarNotas() {
    const id = document.getElementById('notas-npc-id').value;
    const notas = document.getElementById('notas-texto').value;
    
    try {
        await fetch(`/api/npcs/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notas: notas })
        });
        
        fecharModal('modal-notas');
        
    } catch (error) {
        console.error('Erro ao salvar notas:', error);
    }
}

function fecharModal(modalId) {
    document.getElementById(modalId).classList.remove('ativo');
}

// Recarrega quando muda o filtro de conhecidos
document.getElementById('filtro-conhecido').addEventListener('change', carregarNPCs);
</script>
{% endblock %}
